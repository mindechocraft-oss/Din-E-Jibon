<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (e && typeof e.filename === 'string' && /^(chrome|moz|safari)-extension:\/\//.test(e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          var msg = e && e.reason && (e.reason.stack || e.reason.message || String(e.reason));
          if (typeof msg === 'string' && /(chrome|moz|safari)-extension:\/\//.test(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>দীন-ই-জীবন (Deen-e-Jibon) — সম্পূর্ণ বাংলা ইসলামিক অ্যাপ</title>

    />
